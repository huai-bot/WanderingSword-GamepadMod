[mouse]
; 右摇杆鼠标速度(像素/秒,恒定)。游戏内可用 View+十字键 或 [ ] 键实时调整
speed=1400
; 死区,越小越灵敏(摇杆有漂移时调大)
deadzone=3000

[snap]
; UI吸附 1=开 0=关
enable=1
; 离按钮多少像素内松开摇杆会吸附过去(1080p基准)
radius=40
; 指针在按钮上时的减速比例(百分比)
friction=60

[interact]
; 交互判定半径(游戏原值35)
range=90

[backpack]
; 打开人物界面时自动整理 1=开 0=关
auto_sort=1
; 默认排序 1=珍贵 2=时间 3=价钱 4=类型
default_sort=4
; 隐藏当前角色无法使用的装备 1=开 0=关
hide_unusable=1
; 比身上装备属性更高的装备显示高亮框 1=开 0=关
highlight_better=1
; 判定方式 0=严格(没有任何属性更低且至少一项更高) 1=综合(各属性相对提升之和为正)
better_mode=0
; 武器只和身上同类型武器比较(剑比剑) 1=开 0=关
same_weapon_type=1
; 高亮框颜色(十六进制 RGB),默认淡蓝紫 B4AAFF
highlight_rgb=B4AAFF
