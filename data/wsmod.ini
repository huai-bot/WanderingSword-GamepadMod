[mouse]
; 右摇杆鼠标速度(像素/秒,恒定)。游戏内可用 View+十字键 或 [ ] 键实时调整
speed=1400
; 死区,越小越灵敏(摇杆有漂移时调大)
deadzone=3000

[snap]
; UI吸附 1=开 0=关
enable=1
; 离按钮多少像素内松开摇杆会吸附过去(1080p基准)
radius=40
; 指针在按钮上时的减速比例(百分比)
friction=60

[interact]
; 交互判定半径(游戏原值35)
range=90

[backpack]
; 打开人物界面时自动整理 1=开 0=关
auto_sort=1
; 默认排序 1=珍贵 2=时间 3=价钱 4=类型
default_sort=4
; 隐藏当前角色无法使用的装备 1=开 0=关
hide_unusable=1
; 比身上装备属性更高的装备显示高亮框 1=开 0=关
highlight_better=1
; 判定方式 0=严格(没有任何属性更低且至少一项更高) 1=综合(各属性相对提升之和为正)
better_mode=0
; 武器只和身上同类型武器比较(剑比剑) 1=开 0=关
same_weapon_type=1
; 高亮框颜色(十六进制 RGB),默认淡蓝紫 B4AAFF
highlight_rgb=5C6CFF
; 「全部」分类里隐藏已学成的秘籍/图纸、任务道具、材料和珍宝(仍在各自分类显示) 1=开 0=关
tidy_all_tab=1
; 切换时防闪烁(在游戏生成格子时就隐藏) 1=开 0=关;若出现异常可关闭
cell_hook=1
; 人物界面手柄跳过「属性」「装备」两栏：LT/RT 在 头像→背包→底部按钮 间循环，方向键也不停在这两栏 1=开 0=关
prime_skip_panels=1
; 战斗加速按钮 1倍→2倍→速战→1倍 循环；速战 = 游戏自带自动战斗 + 高倍速，胜负照常由游戏判定 1=开 0=关(只有原版1/2倍)
quick_battle=1
; 速战倍率（3~200，测试过 20/50/100 都稳定）
quick_speed=50
; 速战超过这么多秒还没打完就退回 2 倍速
quick_timeout=90
; 速战时用遮罩盖住游戏画面（高倍速下镜头和界面切换会闪烁） 1=开 0=关
quick_mask=1
; 速战期间临时静音本游戏，退出或结算后恢复原来的静音状态（不影响其他应用） 1=开 0=关
quick_mute=1
